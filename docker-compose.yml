# Local development stack: the app plus its own Postgres.
#
# `cp .env.example .env` first — the app reads secrets from it.
#
# The database lives in the named volume `cash_lens_pgdata`, managed by Docker
# rather than bind-mounted into the repo or into the workspace: a bind mount would
# put database files in the working tree, and a shared directory outside it is how
# two projects end up fighting over one data dir. `docker compose down -v` is the
# deliberate way to drop it.
#
# Postgres listens on 5432 inside the compose network only — the port is
# deliberately not published to the host. Nothing outside these two containers
# can reach the database, and the port cannot clash with another Postgres on the
# machine. The consequence is that host-side tooling cannot connect either:
# run mix inside the app container.
#
#   docker compose exec app mix test
#   docker compose exec app iex -S mix
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cash_lens
    # No `ports:` — internal to the compose network by design. Services on the
    # same network reach each other on any port without publishing.
    volumes:
      - cash_lens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: /bin/sh -c "mix deps.get && mix phx.server"
    ports:
      - "4444:4444"
    env_file:
      - dev.env
    volumes:
      - .:/app
      - /app/_build
      - /app/deps
      # The monitored statement folder is deliberately NOT mounted here. It lives
      # in a Google Drive CloudStorage directory, whose files are placeholders
      # that macOS materialises on demand through the FileProvider framework.
      # A Docker bind mount cannot trigger that materialisation: the directory
      # lists, and reading an unmaterialised statement fails with EIO — sometimes
      # on the first read and not the second, which is worse than failing
      # outright. Importing from that folder runs natively: ./run
    depends_on:
      db:
        condition: service_healthy

volumes:
  cash_lens_pgdata:
